# bootc-image-builder config for the installer ISO (make iso).
# The ISO installs the embedded image, then %post points the system at the registry image
# so every later `bootc upgrade` follows this repo's builds.
[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/prossouw79/kinoite-bio:latest
%end
"""

# The installer only asks about storage; Plasma Setup (Kinoite's first-boot wizard) creates the
# user and sets language/timezone, like stock Kinoite.
[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Subscription",
  "org.fedoraproject.Anaconda.Modules.Timezone",
]
